<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Background Studio Card -->
  <rect width="600" height="700" rx="28" fill="url(#bgGrad)"/>
  <circle cx="300" cy="220" r="180" fill="#FFFFFF" fill-opacity="0.6"/>
  
  <!-- Subtle Medical Cross Accent -->
  <path d="M500 100v40M480 120h40" stroke="#0284C7" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M100 480v30M85 495h30" stroke="#008080" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Doctor Silhouette / Illustration -->
  <!-- Shoulders & Coat -->
  <path d="M120 700c0-140 70-220 180-220s180 80 180 220H120z" fill="url(#coatGrad)"/>
  <!-- Inner Scrubs -->
  <path d="M250 480l50 70 50-70v160H250V480z" fill="url(#scrubGrad)"/>
  <!-- Stethoscope -->
  <path d="M240 500c0 80 40 120 60 120s60-40 60-120" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <circle cx="300" cy="625" r="14" fill="#64748B" stroke="#0F172A" stroke-width="4"/>
  
  <!-- Coat Lapels -->
  <path d="M220 480l40 160h-50l-50-160h60z" fill="#E2E8F0"/>
  <path d="M380 480l-40 160h50l50-160h-60z" fill="#E2E8F0"/>
  
  <!-- Neck -->
  <path d="M265 370h70v120h-70z" fill="#FBD38D"/>
  
  <!-- Head & Hair -->
  <circle cx="300" cy="310" r="75" fill="#FBD38D"/>
  <!-- Professional Hair -->
  <path d="M225 310c0-60 40-90 75-90s75 30 75 90c-15-20-40-30-75-30s-60 10-75 30z" fill="#1E293B"/>
  
  <!-- Facial Features -->
  <!-- Friendly Eyes -->
  <path d="M270 300q10 -6 20 0" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M310 300q10 -6 20 0" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M280 345q20 16 40 0" stroke="#C05621" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Eyeglasses -->
  <rect x="260" y="290" width="34" height="24" rx="6" stroke="#005A9C" stroke-width="3" fill="none"/>
  <rect x="306" y="290" width="34" height="24" rx="6" stroke="#005A9C" stroke-width="3" fill="none"/>
  <line x1="294" y1="300" x2="306" y2="300" stroke="#005A9C" stroke-width="3"/>

  <!-- Badge Overlay -->
  <g transform="translate(40, 600)">
    <rect width="250" height="64" rx="14" fill="#FFFFFF" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))"/>
    <circle cx="34" cy="32" r="18" fill="#E0F2FE"/>
    <path d="M26 32l6 6 12-12" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#002147">Dr. [DOCTOR_NAME]</text>
    <text x="64" y="44" font-family="'Roboto', sans-serif" font-size="11" fill="#008080">Board-Certified ENT Specialist</text>
  </g>
</svg>
