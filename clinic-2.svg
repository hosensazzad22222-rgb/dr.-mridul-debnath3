<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" fill="none">
  <rect width="500" height="300" rx="14" fill="#F0FDFA"/>
  <!-- Specialized Medical Pavilion -->
  <rect x="90" y="70" width="320" height="190" rx="8" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/>
  <!-- Medical Suite sign -->
  <rect x="180" y="45" width="140" height="26" rx="6" fill="#008080"/>
  <text x="250" y="62" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SPECIALTY SUITE</text>
  <!-- Architectural vertical glass louvers -->
  <g fill="#CCFBF1">
    <rect x="120" y="90" width="60" height="110" rx="4"/>
    <rect x="200" y="90" width="60" height="110" rx="4"/>
    <rect x="280" y="90" width="60" height="110" rx="4"/>
    <rect x="360" y="90" width="30" height="110" rx="4"/>
  </g>
  <!-- Reception Door -->
  <rect x="210" y="210" width="80" height="50" rx="4" fill="#005A9C"/>
  <circle cx="230" cy="235" r="3" fill="#FFFFFF"/>
</svg>
